# fly.toml – Fly.io deployment configuration
# Docs: https://fly.io/docs/reference/configuration/
#
# Quick-start:
#   1. Install flyctl:  https://fly.io/docs/hands-on/install-flyctl/
#   2. fly auth signup  (or fly auth login)
#   3. fly launch --no-deploy          # reads this file, skips first deploy
#   4. Set secrets:  fly secrets set SECRET_KEY="..." GOOGLE_SHEETS_CREDENTIALS_JSON='...'
#   5. fly deploy

app = "apartment-mgmt"        # change to any globally-unique name
primary_region = "sin"        # Singapore — closest to India; see `fly platform regions`

[build]
  # Uses the Dockerfile in this repo

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = true   # free-tier machines sleep when idle
  auto_start_machines = true   # wake up on first request (~2 s cold start)

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
