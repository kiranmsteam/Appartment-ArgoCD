# railway.toml – Railway.app deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"          # Railway auto-detects Python + pip

[deploy]
startCommand = "gunicorn app:app --timeout 120"
healthcheckPath = "/login"
healthcheckTimeout = 300      # seconds to wait for first health-check
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
