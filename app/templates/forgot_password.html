{% extends 'base.html' %}
{% block title %}Forgot Password – Hitech Citadel Phase 2{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <i class="fas fa-envelope fa-3x"></i>
      <h1>Forgot Password</h1>
      <p>Enter your apartment number and we'll send a new password to your registered email.</p>
    </div>
    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="flat"><i class="fas fa-door-open"></i> Apartment No</label>
        <input type="text" id="flat" name="flat" placeholder="e.g. RG1"
               required autocomplete="username" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-paper-plane"></i> Send New Password
      </button>
    </form>
    <p style="text-align:center; margin-top:1rem;">
      <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
