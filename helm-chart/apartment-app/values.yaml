# Default values for apartment-app Helm chart.

replicaCount: 2

image:
  repository: apartment-app
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: NodePort
  port: 8080
  nodePort: 30080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  port: "8080"
  envName: "development"
