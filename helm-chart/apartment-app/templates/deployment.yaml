apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.env.port | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.env.envName | quote }}
            - name: GOOGLE_SHEETS_CREDENTIALS_FILE
              value: {{ .Values.env.googleSheetsCredentialsFile | quote }}
            - name: GOOGLE_SHEET_BALANCE_ID
              value: {{ .Values.env.googleSheetBalanceId | quote }}
            - name: GOOGLE_SHEET_CRDR_ID
              value: {{ .Values.env.googleSheetCrdrId | quote }}
